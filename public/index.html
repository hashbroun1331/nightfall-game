<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0d12"><title>Nightfall v2.3</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<section id="home" class="panel hero">
  <div class="logo">🌙</div><h1>NIGHTFALL</h1><p>Social deduction multiplayer • Bahasa Indonesia</p>
  <input id="name" maxlength="18" placeholder="Nama pemain">
  <button id="create">BUAT ROOM</button><div class="or">— atau —</div>
  <input id="roomCode" maxlength="6" placeholder="Kode room">
  <button id="join" class="secondary">JOIN ROOM</button>
  <button id="reconnect" class="ghost hidden">🔄 Sambung kembali ke game terakhir</button>
  <p id="homeErr" class="err"></p>
</section>
<section id="game" class="hidden">
  <header><div><b id="roomTitle"></b></div><div id="phase" class="phase"></div><div id="timer"></div></header>
  <div id="roleCard" class="role-card hidden"></div>
  <div class="grid">
    <section class="panel"><div class="section-title"><h2>👥 Pemain</h2><span id="aliveCount"></span></div><div id="players"></div><div id="lobbyControls"></div></section>
    <section class="panel"><h2>🎯 Aksi</h2><div id="actions">Menunggu…</div></section>
    <section class="panel chat-panel"><h2>💬 Chat</h2>
      <div class="tabs"><button data-scope="all" class="tab active">Semua</button><button data-scope="private" class="tab">Privat</button><button data-scope="mafia" class="tab">Mafia</button><button data-scope="jail" class="tab">Jail</button><button data-scope="dead" class="tab">Mati</button></div>
      <select id="pmTarget" class="hidden"></select><div id="chat"></div><div class="chatbox"><input id="chatInput" maxlength="400" placeholder="Tulis pesan…"><button id="send">Kirim</button></div>
    </section>
  </div>
</section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
